# Python environment for the ASC semantic-map analyses.
#
# Based on the `fastsrm` conda environment used to produce the published results
# (conda 4.9.2, Windows x64).  Everything except the interpreter and the MKL stack
# was installed with pip.  This file installs the interpreter plus
# requirements.txt (the packages the pipelines import, at their published
# versions); a second command adds brainstat without dependency resolution:
#
#   conda env create -f environment/environment.yml
#   conda activate asc-semantic-map
#   pip install --no-deps -r environment/requirements-nodeps.txt
#
# requirements-lock.txt is the full snapshot of the original environment, for
# provenance.  It contains conflicting pins and is not installed from here.
#
# The environment is named `asc-semantic-map` rather than `fastsrm`: the original
# name refers to a package (fastsrm) that only the preprocessing/SRM stages need,
# and those stages are not part of this repository.
#
# Scope note: the verification pipelines shipped here (P4, P5, P7, P8) do NOT
# import brainiak, fastsrm or neuromaps.  The shared response model was fitted
# with brainiak 0.11 in a separate environment, and fastsrm was not used for the
# published results; neither stage is reproduced here; the `neuromaps-data`
# atlas files are vendored under templates/ so the neuromaps package is not
# needed either.  They are therefore absent from requirements.txt.

name: asc-semantic-map

channels:
  - defaults

dependencies:
  - python=3.8.12
  - pip=21.2.2
  - setuptools=58.0.4
  - wheel=0.37.0
  # MKL-backed BLAS, as used for the published run.  Results are numerically
  # stable across BLAS implementations, but this is what was used.
  - blas=1.0
  - mkl=2021.4.0
  - mkl-service=2.4.0
  - mkl_fft=1.3.1
  - mkl_random=1.2.2
  - intel-openmp=2021.4.0
  - pip:
      - -r requirements.txt
