# Python environment for the ASC semantic-map analyses.
#
# Captured from the `fastsrm` conda environment used to produce the published
# results (conda 4.9.2, Windows x64).  Everything except the interpreter and the
# MKL stack was installed with pip, so the exact package set lives in
# requirements-lock.txt and is installed from there.
#
#   conda env create -f environment.yml
#   conda activate asc-semantic-map
#
# The environment is named `asc-semantic-map` rather than `fastsrm`: the original
# name refers to a package (fastsrm) that only the preprocessing/SRM stages need,
# and those stages are not part of this repository.
#
# Scope note: the verification pipelines shipped here (P4, P5, P7, P8) do NOT
# import brainiak, fastsrm or neuromaps.  brainiak and fastsrm belong to the
# SRM/preprocessing stages, which are not reproduced here; the `neuromaps-data`
# atlas files are vendored under templates/ so the neuromaps package is not
# needed either.  They are therefore absent from requirements-lock.txt.

name: asc-semantic-map

channels:
  - defaults

dependencies:
  - python=3.8.12
  - pip=21.2.2
  - setuptools=58.0.4
  - wheel=0.37.0
  # MKL-backed BLAS, as used for the published run.  Results are numerically
  # stable across BLAS implementations, but this is what was used.
  - blas=1.0
  - mkl=2021.4.0
  - mkl-service=2.4.0
  - mkl_fft=1.3.1
  - mkl_random=1.2.2
  - intel-openmp=2021.4.0
  - pip:
      - -r requirements-lock.txt
